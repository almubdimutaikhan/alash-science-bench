name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 scripts/build_alash_science.py --check
      - run: python3 scripts/export_hf.py --check
      - run: python3 scripts/make_review_pack.py --check
      - name: Dataset loads with the datasets library
        run: |
          pip install datasets
          python3 -c "from datasets import load_dataset; d=load_dataset('json', data_files='data/test.jsonl', split='train'); assert len(d)==160, len(d); print(d.features)"
